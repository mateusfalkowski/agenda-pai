<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda de Compromissos</title>
<meta name="description" content="Agenda de visitas a clientes com lembretes no celular.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f5fa">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1220">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<link rel="modulepreload" href="js/app.js">
<link rel="modulepreload" href="js/logic.js">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18.5 14.8c1.6.8 2.7 2.5 3 5.2"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 3.5h3.2l1.6 4.2-2.1 1.4a11 11 0 0 0 5.2 5.2l1.4-2.1 4.2 1.6V17a2 2 0 0 1-2.2 2A15.5 15.5 0 0 1 3 5.7a2 2 0 0 1 2-2.2z"/></symbol>
  <symbol id="i-message" viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-11.6 7.1L4 20l1.4-4.2A8 8 0 1 1 20 11.5z"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><path d="M3 6.5l6-2.5 6 2.5 6-2.5v13.5l-6 2.5-6-2.5-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></symbol>
  <symbol id="i-navigation" viewBox="0 0 24 24"><path d="M12 2.5l7.5 18-7.5-4-7.5 4z"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 2.5l3 3-3 3M4 11.5v-1a5 5 0 0 1 5-5h11M7 21.5l-3-3 3-3M20 12.5v1a5 5 0 0 1-5 5H4"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 10a6 6 0 0 1 12 0c0 5 2 6.5 2 6.5H4S6 15 6 10zM10 20a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3.5v11M7.5 10l4.5 4.5 4.5-4.5M4.5 19.5h15"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.5v.5"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.6A10 10 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-2.6 3.4M6.6 6.6A16.6 16.6 0 0 0 2.5 12s3.5 6.5 9.5 6.5a9.6 9.6 0 0 0 4.4-1.1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 20.5H5.5a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2H9M15.5 16.5L20 12l-4.5-4.5M20 12H9"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3L10 14M21 3l-6.5 18-4.5-7-7-4.5z"/></symbol>
  <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="M3 3l18 18M8.5 16.4a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 5.5-2.8M14.8 10.3A10 10 0 0 1 19 12.9M2 9.3a15 15 0 0 1 4.3-2.7M10.7 5.1A15 15 0 0 1 22 9.3M12 20h.01"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20.5c.8-4 4-6 8-6s7.2 2 8 6"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 7.8v.4"/></symbol>
  <symbol id="i-phone-device" viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M11 18.5h2"/></symbol>
  <symbol id="i-money" viewBox="0 0 24 24"><path d="M12 3v18M16.5 7.5c-.5-1.6-2.3-2.5-4.5-2.5-2.5 0-4.5 1.3-4.5 3.4 0 4.6 9.2 2.4 9.2 7.2 0 2.1-2 3.4-4.7 3.4-2.4 0-4.3-1-4.8-2.8"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
</svg>

<div id="boot" class="boot" aria-live="polite">
  <div class="boot-logo"><svg class="i"><use href="#i-calendar"/></svg></div>
  <p>Carregando…</p>
</div>

<div id="login-screen" class="login" hidden>
  <form id="login-form" class="login-card" novalidate>
    <div class="login-logo"><svg class="i"><use href="#i-calendar"/></svg></div>
    <h1>Agenda</h1>
    <p class="muted">Entre para ver seus compromissos.</p>
    <label class="field">
      <span>E-mail</span>
      <input id="login-email" type="email" autocomplete="username" inputmode="email" required>
    </label>
    <label class="field">
      <span>Senha</span>
      <span class="input-with-btn">
        <input id="login-password" type="password" autocomplete="current-password" required>
        <button type="button" class="icon-btn" id="toggle-password" aria-label="Mostrar senha"><svg class="i"><use href="#i-eye"/></svg></button>
      </span>
    </label>
    <p id="login-error" class="form-error" role="alert"></p>
    <button type="submit" class="btn btn-primary btn-block" id="login-btn">Entrar</button>
    <button type="button" class="btn-link" id="forgot-btn">Esqueci minha senha</button>
  </form>
</div>

<div id="app" hidden>
  <header class="topbar">
    <h1 id="view-title">Agenda</h1>
    <span id="offline-pill" class="pill pill-warn" hidden><svg class="i"><use href="#i-wifi-off"/></svg>Sem internet</span>
  </header>

  <main>
    <section id="view-agenda" class="view" aria-labelledby="view-title"></section>
    <section id="view-clients" class="view" hidden aria-labelledby="view-title"></section>
    <section id="view-settings" class="view" hidden aria-labelledby="view-title"></section>
  </main>

  <button id="fab" class="fab" type="button" aria-label="Novo compromisso"><svg class="i"><use href="#i-plus"/></svg></button>

  <nav class="bottom-nav" aria-label="Navegação principal">
    <button class="nav-btn" data-tab="agenda" aria-current="page"><svg class="i"><use href="#i-calendar"/></svg><span>Agenda</span></button>
    <button class="nav-btn" data-tab="clients"><svg class="i"><use href="#i-users"/></svg><span>Clientes</span></button>
    <button class="nav-btn" data-tab="settings"><svg class="i"><use href="#i-settings"/></svg><span>Ajustes</span></button>
  </nav>
</div>

<div id="toasts" aria-live="polite"></div>

<noscript><p class="noscript">Este app precisa de JavaScript ativado.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
